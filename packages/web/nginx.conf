server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must never be cached, or a stale one pins users to an
  # old build after every deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Built files carry a content hash in their name, so they can be cached
  # forever — a new build gets new names.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. index.html must be revalidated on every visit: it is the
  # only file that points at the current build's assets, and without this
  # header browsers cache it heuristically and keep showing the old site
  # after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
