server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must never be cached, or a stale one pins users to an
  # old build after every deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
