# SehatSaathi vhost for the EXISTING host nginx.
#
# TLS lives HERE, not in sites-enabled/default. Running `certbot --nginx`
# against a fresh domain on this box makes certbot hijack the stock catch-all
# block in `default` — it repoints that block's server_name at your domain and
# leaves it serving /var/www/html, so HTTPS returns the default nginx page and
# every /api route 404s. The cert itself is fine; only the placement is wrong.
#
# Install:
#   cp deploy/nginx-sehatsaathi.conf /etc/nginx/sites-available/sehatsaathi
#   nginx -t && systemctl reload nginx
#
# The certificate is already issued at:
#   /etc/letsencrypt/live/sehatsaathi.arunkumar.works/

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sehatsaathi.arunkumar.works;

    ssl_certificate     /etc/letsencrypt/live/sehatsaathi.arunkumar.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sehatsaathi.arunkumar.works/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Voice WebSocket.
    #
    # Two things here are not optional. Without the Upgrade/Connection headers
    # nginx silently downgrades the socket to a plain HTTP request and the
    # realtime voice loop never connects. And the default 60s proxy_read_timeout
    # would sever a conversation mid-sentence, because a voice turn can sit
    # quiet while the patient thinks.
    location /ws {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Audio must reach the browser as it is generated, not in buffered
        # lumps — buffering here would destroy the sub-second latency budget.
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The PWA.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audio uploads are small, but a long clinical turn transcript is not.
    client_max_body_size 12m;

    access_log /var/log/nginx/sehatsaathi.access.log;
    error_log  /var/log/nginx/sehatsaathi.error.log;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────
# Microphone access requires a secure context, so plain HTTP is never useful
# here — redirect rather than serve a version of the app that cannot work.
server {
    listen 80;
    listen [::]:80;
    server_name sehatsaathi.arunkumar.works;
    return 301 https://$host$request_uri;
}
